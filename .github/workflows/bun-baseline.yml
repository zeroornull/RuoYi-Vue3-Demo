name: bun-baseline

on:
  workflow_dispatch:

jobs:
  env-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        # Reads package.json "packageManager": "bun@1.4.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frozen lockfile install
        run: bun install --frozen-lockfile
      - name: Env check
        run: bun run env:check
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Tests
        run: bun run test
      - name: Development build
        run: bunx --bun vite build --mode development
      - name: Staging build
        run: bun run build:stage
      - name: Production build
        run: bun run build:prod
